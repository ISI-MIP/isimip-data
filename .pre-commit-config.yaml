# this file is updated using `pre-commit-update`

# do not touch the migration files at all: these are auto-generated by Django
exclude: \/migrations\/

repos:
- repo: meta
  hooks:
  - id: check-hooks-apply

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-ast
  - id: check-json
  - id: check-xml
  - id: check-yaml
  - id: end-of-file-fixer
    exclude: \.html$|\.sql$|\.svg$|\.txt$
  - id: trailing-whitespace
    exclude: \.sql$|\.svg$
  - id: debug-statements

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 7c55798a78262d14b2074abf623d8a992ebb70d4  # frozen: v0.16.2
  hooks:
  - id: ruff-check
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-format

- repo: https://github.com/pre-commit/mirrors-eslint
  rev: 289fa94d7703a1865c70cca7a9cb06e7c4298591  # frozen: v10.8.1
  hooks:
  - id: eslint
    args: [--fix, --color]
    files: \.[j]sx?$  # *.js, *.jsx
    types: [file]
    additional_dependencies:
    - eslint@9.39.4
    - eslint-plugin-react@7.37.5
    - eslint-plugin-simple-import-sort@12.1.1
    - react@18.3.1

- repo: https://github.com/adhtruong/mirrors-typos
  rev: 9974b3a471ecb52ad53e2d6369ebfe574cb3c621  # frozen: v1.49.0
  hooks:
  - id: typos
    exclude: |
      (?x)^(
        config/settings/environments/.*|
        isimip_data/download/constants.py|
        testing/sql.*
      )$
